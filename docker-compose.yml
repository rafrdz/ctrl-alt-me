services:
  database:
    image: "postgres:18"
    environment:
      - POSTGRES_USER=${DATABASE_USER:-username}
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD:-password}
      - POSTGRES_DB=${DATABASE_NAME:-ctrl_alt_me}
    volumes:
      - ctrlaltme_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-username} -d ${DATABASE_NAME:-ctrl_alt_me}"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "${DATABASE_PORT:-5432}:5432"
    restart: unless-stopped
volumes:
  ctrlaltme_data:
